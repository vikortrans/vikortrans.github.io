<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Shopper</title>
    <!-- FontAwesome 아이콘 사용을 위한 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 1. 상단 유틸리티 및 헤더 영역 */
        header {
            background-color: #fff;
            border-bottom: 1px solid #eaeaea;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            background-color: #f5f5f7;
            border-radius: 4px;
            padding: 6px 12px;
            width: 250px;
        }

        .header-left input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: #333;
        }

        .header-left i {
            color: #666;
            font-size: 14px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 18px;
            color: #222;
        }

        .logo i {
            font-size: 20px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: #444;
        }

        .header-right span {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 2. 카테고리 네비게이션 바 (보라색 계열) */
        nav {
            background-color: #3b145b;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            white-space: nowrap;
            padding: 0 10px;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            padding: 12px 16px;
            font-size: 13px;
            transition: color 0.2s, background-color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #fff;
            background-color: #4d1c75;
        }

        /* 3. 메인 배너 슬라이더 영역 */
        .hero-banner {
            position: relative;
            background: linear-gradient(135deg, #2c163a, #111);
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .hero-images {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .hero-images img {
            height: 260px;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .banner-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.2s;
        }

        .banner-arrow:hover {
            background: rgba(255,255,255,0.4);
        }

        .banner-arrow.left { left: 20px; }
        .banner-arrow.right { right: 20px; }

        .banner-dots {
            position: absolute;
            bottom: 15px;
            display: flex;
            gap: 6px;
        }

        .banner-dots span {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            cursor: pointer;
        }

        .banner-dots span.active {
            background: #fff;
            width: 20px;
            border-radius: 4px;
        }

        /* 4. Store's Categories 섹션 */
        .categories-section {
            padding: 40px 20px;
            text-align: center;
            background-color: #fff;
        }

        .categories-section h2 {
            font-size: 20px;
            font-weight: 600;
            color: #222;
            margin-bottom: 30px;
        }

        .category-grid {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            max-width: 1000px;
            margin: 0 auto;
            align-items: center;
        }

        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 110px;
        }

        .category-icon-box {
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .category-icon-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .category-item span {
            font-size: 13px;
            color: #333;
            line-height: 1.3;
        }

        .category-next-btn {
            background-color: #3b145b;
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 20, 91, 0.3);
        }
    </style>
</head>
<body>

    <!-- 상단 헤더 -->
    <header>
        <div class="header-left">
            <input type="text" placeholder="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="logo">
            <i class="fa-solid fa-bag-shopping"></i>
            Pocket Shopper
        </div>
        <div class="header-right">
            <span><i class="fa-regular fa-heart" style="color: #f39c12;"></i> 0</span>
            <span><i class="fa-solid fa-cart-shopping" style="color: #27ae60;"></i> 0</span>
            <span><i class="fa-regular fa-user"></i> Welcome admin▾</span>
        </div>
    </header>

    <!-- 카테고리 네비게이션 메뉴 -->
    <nav>
        <a href="#" class="active">All</a>
        <a href="#">Kitchen Accessories</a>
        <a href="#">Groceries</a>
        <a href="#">Sports Accessories</a>
        <a href="#">Smartphones</a>
        <a href="#">Mobile Accessories</a>
        <a href="#">Mens Watches</a>
        <a href="#">Beauty</a>
        <a href="#">Fragrances</a>
        <a href="#">Furniture</a>
        <a href="#">Home Decoration</a>
        <a href="#">Laptops</a>
        <a href="#">Mens Shirts</a>
    </nav>

    <!-- 메인 프로모션 배너 -->
    <section class="hero-banner">
        <button class="banner-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="hero-images">
            <!-- 예시 이미지 (더미 이미지 주소 활용) -->
            <div style="background:#444; width:220px; height:240px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#888;">Bag 1</div>
            <div style="background:#2a523b; width:260px; height:260px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#888;">Bag 2</div>
            <div style="background:#333; width:180px; height:240px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:#888;">Wallets</div>
        </div>
        <button class="banner-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="banner-dots">
            <span class="active"></span>
            <span></span>
            <span></span>
        </div>
    </section>

    <!-- 스토어 카테고리 바로가기 섹션 -->
    <section class="categories-section">
        <h2>Store's Categories</h2>
        <div class="category-grid">
            <div class="category-item">
                <div class="category-icon-box">
                    <i class="fa-solid fa-mug-hot" style="font-size: 40px; color: #333;"></i>
                </div>
                <span>Kitchen Accessories</span>
            </div>
            <div class="category-item">
                <div class="category-icon-box">
                    <i class="fa-solid fa-clock" style="font-size: 40px; color: #333;"></i>
                </div>
                <span>Mens Watches</span>
            </div>
            <div class="category-item">
                <div class="category-icon-box">
                    <i class="fa-solid fa-laptop" style="font-size: 40px; color: #333;"></i>
                </div>
                <span>Laptops</span>
            </div>
            <div class="category-item">
                <div class="category-icon-box">
                    <i class="fa-solid fa-shirt" style="font-size: 40px; color: #333;"></i>
                </div>
                <span>Tops</span>
            </div>
            <div class="category-item">
                <div class="category-icon-box">
                    <i class="fa-solid fa-stopwatch" style="font-size: 40px; color: #333;"></i>
                </div>
                <span>Womens Watches</span>
            </div>
            <button class="category-next-btn">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </section>

</body>
</html>
